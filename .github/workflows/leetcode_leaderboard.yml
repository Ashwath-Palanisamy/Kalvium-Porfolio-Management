name: LeetCode Leaderboard Update Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-leetcode-cron:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install curl
        run: apk add --no-cache curl

      - name: Trigger Cron Endpoint
        run: |
          curl -s -f -X POST "${{ secrets.BACKEND_URL }}/cron/update-leetcode" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"